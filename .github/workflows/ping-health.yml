name: Ping Backend Health

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl /health
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "Missing secret RENDER_HEALTH_URL" >&2
            exit 1
          fi

          curl -fsS --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors "$HEALTH_URL" | cat
